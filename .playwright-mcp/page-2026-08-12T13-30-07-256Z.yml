      - generic [ref=f10e270]:
        - generic [ref=f10e271]:
          - heading "§ 控制欲的错觉" [level=2] [ref=f10e272]
          - paragraph [ref=f10e273]: 写命令式代码时，我总想亲手拧住每一个状态，仿佛松开手程序就会崩塌。后来我发现真正让程序崩塌的，恰好是这种事无巨细的控制。
          - paragraph [ref=f10e274]: 函数式的第一步不是学 monad，而是接受一件事：状态不该被“维护”，只该被“推导”。让数据流替你说话。
        - generic [ref=f10e275]:
          - heading "§ 把副作用赶到墙角" [level=2] [ref=f10e276]
          - paragraph [ref=f10e277]: 副作用不可怕，可怕的是它藏在任何一处。把 IO 全部赶到程序边界，纯函数核心自然变得可测试、可推理、可被同事放心重构。
          - paragraph [ref=f10e278]: 这和你整理工位是一个道理：脏东西只留在门口，桌子永远干净。
        - generic [ref=f10e279]:
          - heading "§ 类型是耐心的老师" [level=2] [ref=f10e280]
          - paragraph [ref=f10e281]: 类型系统把我的“万一”全部提前到编译期回答。剩下的运行时问题，数量少到可以逐个拥抱。
          - paragraph [ref=f10e282]: 焦虑的本质是未知，而类型把未知变成待办。
